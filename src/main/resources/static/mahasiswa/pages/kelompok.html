<!DOCTYPE html>
<html lang="id">
<head>
  <title>JAPRES | Informasi Kelompok</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="/common/global.css">
  <link rel="stylesheet" href="../css/kelompok.css">
  <script src="/common/api.js" defer></script>
  <script src="/common/global.js" defer></script>
  <script src="../js/kelompok.js" defer></script>
</head>
<body data-page="kelompok">
  <aside class="sidebar">
    <a class="brand" href="jadwal.html"><span class="brand-icon"><i class="fa-solid fa-calendar"></i></span> JAPRES</a>
    <nav class="nav-menu">
      <a class="nav-link " href="jadwal.html"><span><i class="fa-regular fa-calendar-days"></i></span> Jadwal Perkuliahan</a>
      <a class="nav-link " href="daftarkuliah.html"><span><i class="fa-solid fa-book"></i></span> Daftar Kuliah</a>
      <a class="nav-link active" href="kelompok.html"><span><i class="fa-solid fa-users"></i></span> Informasi Kelompok</a>
    </nav>
    <div class="sidebar-bottom">
      <button class="logout-btn" data-action="logout">
        <span class="logout-ico"><i class="fa-solid fa-right-from-bracket"></i></span>
        <span><strong>Log Out</strong><small>Keluar dari akun</small></span>
      </button>
    </div>
  </aside>
  <main class="main-content">
    <header class="topbar">
      <div class="course-line"><span class="blue-icon"><i class="fa-solid fa-graduation-cap"></i></span><span id="courseText"></span></div>
      <div class="top-actions">
        <!-- Tombol "Buat Kelompok Baru" DIHAPUS: kelompok dibuat oleh Dosen, bukan mahasiswa -->
        <button class="profile-btn" data-action="profile" aria-haspopup="dialog" title="Lihat profil">
          <span class="avatar-small"><i class="fa-solid fa-user"></i></span>
          <span class="who"><strong>Vivian Kimora</strong><small>Mahasiswa</small></span>
          <i class="fa-solid fa-chevron-down caret"></i>
        </button>
      </div>
    </header>

    <!-- Pemberitahuan bila Dosen sudah mengunci jadwal (diisi oleh kelompok.js) -->
    <section id="lockNotice"></section>

    <!--
      Alur halaman ini:
        1) Dosen membuat kelompok (kosong).
        2) Mahasiswa memilih satu kelompok -> klik "Simpan" (otomatis bergabung / pindah).
        3) Dosen mengunci kelompok -> mahasiswa tidak bisa pindah lagi, lalu Dosen menetapkan jadwal presentasi.
      Jadwal presentasi hanya tampil setelah dikunci (diatur di backend & kelompok.js).
    -->
    <section class="panel">
      <div class="panel-top">
        <div>
          <h2>Bergabung ke Kelompok</h2>
          <p>Periksa kuota sebelum memilih. Setiap mahasiswa hanya boleh berada di satu kelompok per mata kuliah.</p>
        </div>
      </div>
      <div class="group-list" id="groupList"></div>
      <!-- Bar "Simpan": tampil hanya selama kelompok belum dikunci (diisi kelompok.js) -->
      <div class="save-bar hidden" id="saveBar"></div>
    </section>
  </main>
</body>
</html>
