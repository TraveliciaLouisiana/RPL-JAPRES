<!DOCTYPE html>
<html lang="id">
<head>
  <title>JAPRES | Jadwal Perkuliahan</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="/common/global.css">
  <link rel="stylesheet" href="../css/jadwal.css">
  <script src="/common/api.js" defer></script>
  <script src="/common/global.js" defer></script>
  <script src="../js/jadwal.js" defer></script>
</head>
<body data-page="jadwal">
  <aside class="sidebar">
    <a class="brand" href="jadwal.html"><span class="brand-icon"><i class="fa-solid fa-calendar"></i></span> JAPRES</a>
    <nav class="nav-menu">
      <a class="nav-link active" href="jadwal.html"><span><i class="fa-regular fa-calendar-days"></i></span> Jadwal Perkuliahan</a>
      <a class="nav-link " href="daftarkuliah.html"><span><i class="fa-solid fa-book"></i></span> Daftar Kuliah</a>
      <a class="nav-link " href="kelompok.html"><span><i class="fa-solid fa-users"></i></span> Informasi Kelompok</a>
    </nav>
    <div class="sidebar-bottom">
      <button class="logout-btn" data-action="logout">
        <span class="logout-ico"><i class="fa-solid fa-right-from-bracket"></i></span>
        <span><strong>Log Out</strong><small>Keluar dari akun</small></span>
      </button>
    </div>
  </aside>
  <main class="main-content">
    <header class="topbar">
      <div class="course-line"><span class="blue-icon"><i class="fa-solid fa-graduation-cap"></i></span><span id="courseText"></span></div>
      <div class="top-actions">
        <button class="primary-btn" id="newScheduleBtn"><i class="fa-solid fa-plus"></i> New Schedule</button>
        <button class="profile-btn" data-action="profile" aria-haspopup="dialog" title="Lihat profil">
          <span class="avatar-small"><i class="fa-solid fa-user"></i></span>
          <span class="who"><strong>Vivian Kimora</strong><small>Mahasiswa</small></span>
          <i class="fa-solid fa-chevron-down caret"></i>
        </button>
      </div>
    </header>

    <!-- Info jadwal presentasi: terisi otomatis (sudah ditetapkan / belum tersedia / belum bergabung) -->
    <section class="info-bar" id="scheduleInfo"></section>

    <!-- Legenda sekaligus filter: centang jenis jadwal yang ingin ditampilkan -->
    <section class="legend" id="filters" aria-label="Filter kalender">
      <label class="filter-chip"><input type="checkbox" data-filter="class" checked><i class="dot dot-class"></i><span>Kuliah Pribadi</span></label>
      <label class="filter-chip"><input type="checkbox" data-filter="presentation" checked><i class="dot dot-presentation"></i><span>Jadwal Presentasi Kelompok</span></label>
      <label class="filter-chip"><input type="checkbox" data-filter="extra" checked><i class="dot dot-extra"></i><span>Kegiatan Tambahan</span></label>
      <label class="filter-chip"><input type="checkbox" data-filter="free" checked><i class="dot dot-free"></i><span>Slot Kosong</span></label>
      <button class="link-btn hidden" id="resetFilter" type="button">Tampilkan semua</button>
    </section>

    <section class="calendar-wrap">
      <div class="calendar" id="calendar">
        <!-- Baris judul hari (atribut data-day dipakai jadwal.js untuk menyorot hari presentasi) -->
        <div class="cal-row cal-head-row">
          <!-- <div class="calendar-head time-head">Waktu<small>Minggu ke-15</small></div> -->
          <div class="calendar-head time-head"></div>
          <div class="calendar-head" data-day="Senin">SENIN<small>14 Desember</small></div>
          <div class="calendar-head" data-day="Selasa">SELASA<small>15 Desember</small></div>
          <div class="calendar-head" data-day="Rabu">RABU<small>16 Desember</small></div>
          <div class="calendar-head" data-day="Kamis">KAMIS<small>17 Desember</small></div>
          <div class="calendar-head" data-day="Jumat">JUMAT<small>18 Desember</small></div>
        </div>
        <!-- Badan kalender: kolom jam + 5 kolom hari. Isinya diisi oleh jadwal.js -->
        <div class="cal-row cal-body">
          <div class="time-col" id="timeCol"></div>
          <div class="day-col" data-day="Senin"></div>
          <div class="day-col" data-day="Selasa"></div>
          <div class="day-col" data-day="Rabu"></div>
          <div class="day-col" data-day="Kamis"></div>
          <div class="day-col" data-day="Jumat"></div>
        </div>
      </div>
    </section>
  </main>

  <div class="modal-backdrop hidden" id="scheduleModal">
    <div class="modal">
      <button class="modal-close" data-close="scheduleModal" aria-label="Tutup">×</button>
      <h2 id="modalTitle">Detail Jadwal</h2>
      <div id="modalBody"></div>
      <button class="primary-btn modal-ok" data-close="scheduleModal">Tutup</button>
    </div>
  </div>
  <div class="modal-backdrop hidden" id="newScheduleModal">
    <form class="modal form-modal" id="scheduleForm">
      <button type="button" class="modal-close" data-close="newScheduleModal" aria-label="Tutup">×</button>
      <h2>Tambah Kegiatan</h2>
      <p class="hint">Kegiatan pribadi ini hanya tampil di kalender Anda dan tidak mengubah jadwal presentasi dari Dosen.</p>
      <label>Nama kegiatan<input name="title" required placeholder="Contoh: Rapat kelompok"></label>
      <label>Hari<select name="day"><option>Senin</option><option>Selasa</option><option>Rabu</option><option>Kamis</option><option>Jumat</option></select></label>
      <label>Waktu<input name="time" required placeholder="10:30–11:00" pattern="\d{1,2}[.:]\d{2}\s*[–\-]\s*\d{1,2}[.:]\d{2}" title="Format: 10:30–11:00"></label>
      <label>Keterangan<input name="note" placeholder="Contoh: Luring"></label>
      <button class="primary-btn" type="submit">Simpan Kegiatan</button>
    </form>
  </div>
</body>
</html>
